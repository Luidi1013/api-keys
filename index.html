<!DOCTYPE html>
<html>
<head>
    <title>Painel LR Store</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; }
        .box { background: #111; padding: 20px; border-radius: 10px; display: inline-block; margin-top: 50px; border: 1px solid #0f8; }
        input, button { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
        button { background: #0f8; cursor: pointer; font-weight: bold; }
        .key-item { background: #222; padding: 10px; margin: 10px; border-radius: 5px; border-left: 5px solid #0f8; text-align: left; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔐 Gerador de Keys | LR Store</h1>
        <input id="k" placeholder="Nome da Key">
        <input id="d" type="number" placeholder="Dias">
        <button onclick="criar()">CRIAR</button>
        <hr>
        <div id="lista"></div>
    </div>
    <script>
        const API = window.location.origin;

        async function criar() {
            const key = document.getElementById("k").value;
            const dias = document.getElementById("d").value;
            if(!key || !dias) return alert("Preencha os campos!");
            await fetch(API + "/criarkey", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ key, dias })
            });
            alert("Key criada!");
            carregar();
        }

        async function carregar() {
            const res = await fetch(API + "/keys");
            const data = await res.json();
            let h = "";
            for (let k in data) {
                h += `<div class="key-item">
                    <b>${k}</b> | HWID: ${data[k].hwid || 'Livre'}<br>
                    <button onclick="del('${k}')" style="background:red;color:white">Deletar</button>
                </div>`;
            }
            document.getElementById("lista").innerHTML = h;
        }

        async function del(k) {
            await fetch(API + "/delete?key=" + k);
            carregar();
        }
        setInterval(carregar, 5000);
        carregar();
    </script>
</body>
</html>
